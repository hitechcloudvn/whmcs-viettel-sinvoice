name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none

      - name: PHP lint module files
        run: |
          set -e
          for f in viettel_sinvoice.php hooks.php lib/bootstrap.php lang/english.php lang/vietnamese.php; do
            php -l "$f"
          done

      - name: Lint all PHP files
        run: |
          set -e
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

  security-grep:
    name: Security grep checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: No disabled TLS
        run: |
          ! grep -rnE 'CURLOPT_SSL_VERIFYPEER[^;]*(false|0)|CURLOPT_SSL_VERIFYHOST[^;]*(false|0|[^0-9]1)' \
            viettel_sinvoice.php hooks.php lib lang

      - name: No hardcoded secrets
        run: |
          ! grep -rniE "(password|secret|api_?key|token)[[:space:]]*=>[[:space:]]*'[^']{8,}'" \
            viettel_sinvoice.php hooks.php lib lang

      - name: No unsafe raw logging
        run: |
          ! grep -rnE 'log(ModuleCall|Activity)\([^)]*\$_(GET|POST|REQUEST|SERVER|COOKIE)' \
            viettel_sinvoice.php hooks.php lib lang

      - name: No dangerous calls
        run: |
          ! grep -rnE '\b(eval|shell_exec|passthru|unserialize|var_dump|print_r)[[:space:]]*\(' \
            viettel_sinvoice.php hooks.php lib lang

      - name: No direct-access guard removal
        run: |
          for f in viettel_sinvoice.php hooks.php lib/bootstrap.php lang/english.php lang/vietnamese.php; do
            grep -q "defined('WHMCS')" "$f"
          done
